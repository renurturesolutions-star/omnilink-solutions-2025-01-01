
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join FixMate — Contractor Onboarding</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="nav">
    <div class="logo"><div class="badge">FM</div> Contractors</div>
    <div>
      <a class="btn" href="index.html">Home</a>
      <a class="btn primary" href="contractor-login.html">Admin Login</a>
    </div>
  </div>

  <main class="container">
    <div class="card">
      <div class="section-title">Join the network</div>
      <div class="small">Fill this out — we’ll review fast. You’ll email your **company token** after approval. For token creation, send your **Telegram @username / Telegram numeric ID** to admin.</div>
      <div class="row">
        <div class="stack">
          <label class="small">Business Name</label>
          <input id="biz" class="input">
          <label class="small">Owner Full Name</label>
          <input id="owner" class="input">
          <label class="small">Email</label>
          <input id="email" class="input">
        </div>
        <div class="stack">
          <label class="small">Phone</label>
          <input id="phone" class="input">
          <label class="small">Primary Service</label>
          <input id="primary" class="input" placeholder="e.g., Plumbing">
          <label class="small">Areas Covered</label>
          <input id="areas" class="input" placeholder="e.g., Durban North, Umhlanga">
        </div>
      </div>
      <div class="stack" style="margin-top:10px">
        <label class="small">Telegram Username or ID (for personal bot token)</label>
        <input id="telegram" class="input" placeholder="@yourhandle or numeric ID">
        <label class="small">About your company</label>
        <textarea id="about" class="input" rows="2"></textarea>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
        <button class="btn" onclick="location='contractor-login.html'">I already have an account</button>
        <button class="btn primary" id="apply">Apply</button>
      </div>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script>
    document.getElementById('apply').onclick=()=>{
      const c={
        id:crypto.randomUUID(), ts:Date.now(), status:'Pending',
        biz:biz.value.trim(), owner:owner.value.trim(), email:email.value.trim(),
        phone:phone.value.trim(), primary:primary.value.trim(), areas:areas.value.trim(),
        telegram:telegram.value.trim(), about:about.value.trim(), token:''
      };
      upsertContractor(c);
      toast('Application submitted. We will email your token after approval.');
    };
  </script>
</body>
</html>
